            { category: "cat2", code: "Пункт 2.1", title_ua: "Образи та цькування", title_ru: "Оскорбления и травля", desc_ua: "Заборонено ображати гравців, принижувати, цькувати, систематично провокувати та переслідувати їх з метою зіпсувати ігровий процес.", desc_ru: "Запрещено оскорблять игроков, унижать, травливать, систематически провоцировать и преследовать их с целью испортить игровой процесс.", punishment_ua: "Warn → Ban 12 годин → Ban 1–3 дні", punishment_ru: "Warn → Ban 12 часов → Ban 1–3 дня", tags: ["2.1", "образа", "цькування", "травля"] },
            { category: "cat2", code: "Пункт 2.2", title_ua: "Образи родичів", title_ru: "Оскорбление родных", desc_ua: "Заборонено образи, принизливі висловлювання та цілеспрямовані провокації щодо родичів гравця.", desc_ru: "Запрещены оскорбления, унизительные высказывания и целенаправленные провокации в отношении родственников игрока.", punishment_ua: "Ban 3 дні → Ban 7 днів", punishment_ru: "Ban 3 дня → Ban 7 дней", tags: ["2.2", "родичі", "мама", "родные"] },
            { category: "cat2", code: "Пункт 2.3", title_ua: "Погрози в реальному житті", title_ru: "Угрозы в реальной жизни", desc_ua: "Заборонено реальні погрози розправою, заподіянням шкоди здоров’ю чи майну, а також публікацію таких погроз на адресу гравців.", desc_ru: "Запрещены реальные угрозы расправой, причинением вреда здоровью или имуществу, а также публикация таких угроз в адрес игроков.", punishment_ua: "Ban 7–14 днів або Permanent Ban залежно від тяжкості", punishment_ru: "Ban 7–14 дней или Permanent Ban в зависимости от тяжести", tags: ["2.3", "погрози", "реальне життя", "угрозы"] },
            { category: "cat2", code: "Пункт 2.4", title_ua: "Образи працівників проєкту", title_ru: "Оскорбление работников проекта", desc_ua: "Заборонено образи, цькування та погрози на адресу адміністрації й команди проєкту. Коректна критика роботи адміністрації не є порушенням.", desc_ru: "Запрещены оскорбления, травля и угрозы в адрес администрации и команды проекта. Корректная критика работы администрации не является нарушением.", punishment_ua: "Warn → Ban 1–7 днів", punishment_ru: "Warn → Ban 1–7 дней", tags: ["2.4", "адміна", "проект"] },

            // SECTION 3: Зелені зони, територія банди й титули
            { category: "cat3", code: "Пункт 3.1", title_ua: "Зелені зони", title_ru: "Зеленые зоны", desc_ua: "Зелені зони позначені на карті. Тут заборонені напади, перестрілки, пограбування, викрадення, провокації насильства та застосування відмичок. Не можна стріляти із зеленої зони або в гравця всередині неї. Законне затримання не дає права влаштовувати безпідставну стрілянину.", desc_ru: "Зеленые зоны отмечены на карте. Здесь запрещены нападения, перестрелки, ограбления, похищения, провокации насилия и применение отмычек. Нельзя стрелять из зеленой зоны или в игрока внутри нее.", punishment_ua: "Ban 1–3 дні; повторне порушення — Ban 7 днів", punishment_ru: "Ban 1–3 дня; повторное нарушение — Ban 7 дней", tags: ["3.1", "зз", "зелена зона", "green zone"] },
            { category: "cat3", code: "Пункт 3.4", title_ua: "Маска й безпечна зона", title_ru: "Маска и безопасная зона", desc_ua: "Саме носіння маски в зеленій зоні не заборонено. Перевірка особи регулюється пунктом 19.9 розділу про затримання. Маска не є підставою для покарання чи утримання заради XP.", desc_ru: "Само ношение маски в зеленой зоне не запрещено. Проверка личности регулируется пунктом 19.9 раздела о задержании. Маска не является основанием для наказания или удержания ради XP.", punishment_ua: "Адміністративне зауваження / Заборона зловживання", punishment_ru: "Административное замечание / Запрет злоупотребления", tags: ["3.4", "маска", "зз", "xp"] },

            // SECTION 4: RDM, VDM та інші порушення бойового RP
            { category: "cat4", code: "Пункт 4.1", title_ua: "RDM (Random DeathMatch)", title_ru: "RDM (Random DeathMatch)", desc_ua: "Заборонено вбивати або намагатися вбити іншого гравця без достатньої RP-причини та відповідного розвитку ситуації. (Виняток: дозволений DM у територія банди за пунктом 3.2).", desc_ru: "Запрещено убивать или пытаться убить другого игрока без достаточной RP-причины и развития ситуации. (Исключение: разрешен DM в территория банды по пункту 3.2).", punishment_ua: "Ban 1 день → Ban 3 дні", punishment_ru: "Ban 1 день → Ban 3 дня", tags: ["4.1", "rdm", "вбивство", "без причини"] },
            { category: "cat4", code: "Пункт 4.2", title_ua: "VDM (Vehicle DeathMatch)", title_ru: "VDM (Vehicle DeathMatch)", desc_ua: "Заборонено використовувати транспортний засіб для навмисного наїзду на гравців, завдання їм шкоди або вбивства без RP-причини.", desc_ru: "Запрещено использовать транспортное средство для намеренного наезда на игроков, нанесения им вреда или убийства без RP-причины.", punishment_ua: "Ban 1 день → Ban 3 дні", punishment_ru: "Ban 1 день → Ban 3 дня", tags: ["4.2", "vdm", "наїзд", "таран"] },
            { category: "cat4", code: "Пункт 4.3", title_ua: "DM (DeathMatch)", title_ru: "DM (DeathMatch)", desc_ua: "Заборонено нападати на гравця без RP-причини. Умисні удари, початок бійки або застосування зброї без обґрунтованої ігрової ситуації вважаються DM. (Виняток: дозволений DM у територія банди).", desc_ru: "Запрещено нападать на игрока без RP-причины. Намеренные удары, драка или применение оружия без обоснованной ситуации считаются DM. (Исключение: разрешен DM в территория банды).", punishment_ua: "Warn або Ban 12 годин; за серйозне порушення — Ban 1 день", punishment_ru: "Warn или Ban 12 часов; за серьезное нарушение — Ban 1 день", tags: ["4.3", "dm", "бійка", "драка"] },
            { category: "cat4", code: "Пункт 4.4", title_ua: "RK (Revenge Kill)", title_ru: "RK (Revenge Kill)", desc_ua: "Заборонено повертатися на місце власної смерті, щоб помститися гравцеві, який убив персонажа, якщо це порушує правила відновлення після смерті та поточну RP-ситуацію.", desc_ru: "Запрещено возвращаться на место собственной смерти, чтобы отомстить игроку, убившему персонажа.", punishment_ua: "Ban 1 день → Ban 3 дні", punishment_ru: "Ban 1 день → Ban 3 дня", tags: ["4.4", "rk", "помста", "месть"] },
            { category: "cat4", code: "Пункт 4.5", title_ua: "Убивство AFK-гравця", title_ru: "Убийство AFK-игрока", desc_ua: "Заборонено навмисно вбивати гравця, який перебуває в AFK, не може брати участі в ситуації та не становить загрози.", desc_ru: "Запрещено намеренно убивать игрока, находящегося в AFK, который не может принимать участия в ситуации.", punishment_ua: "Ban 12 годин → Ban 1 день", punishment_ru: "Ban 12 часов → Ban 1 день", tags: ["4.5", "afk", "афк", "сон"] },

            // SECTION 5: Правила RP-поведінки
            { category: "cat5", code: "Пункт 5.1", title_ua: "PG (PowerGaming)", title_ru: "PG (PowerGaming)", desc_ua: "Заборонено здійснювати нереалістичні дії, ігнорувати фізичні можливості персонажа або нав’язувати іншому гравцеві результат RP-ситуації без можливості відповісти дією.", desc_ru: "Запрещено совершать нереалистичные действия, игнорировать физические возможности персонажа или навязывать результат RP-ситуации.", punishment_ua: "Warn → Ban 1 день", punishment_ru: "Warn → Ban 1 день", tags: ["5.1", "pg", "powergaming"] },
            { category: "cat5", code: "Пункт 5.2", title_ua: "FearRP", title_ru: "FearRP", desc_ua: "Гравець зобов’язаний цінувати життя свого персонажа й зважати на реальну загрозу. Заборонено ігнорувати погрозу зброєю, чисельну перевагу супротивників та інші очевидно небезпечні обставини.", desc_ru: "Игрок обязан ценить жизнь своего персонажа и учитывать реальную угрозу. Запрещено игнорировать угрозу оружием и численное преимущество.", punishment_ua: "Ban 1 день → Ban 3 дні", punishment_ru: "Ban 1 день → Ban 3 дня", tags: ["5.2", "fearrp", "страх", "життя"] },
            { category: "cat5", code: "Пункт 5.3", title_ua: "NRP (Non-RolePlay)", title_ru: "NRP (Non-RolePlay)", desc_ua: "Заборонено здійснювати дії, що повністю суперечать логіці та реалістичності RolePlay, а також навмисно руйнувати атмосферу ігрового процесу.", desc_ru: "Запрещено совершать действия, полностью противоречащие логике и реалистичности RolePlay, разрушая атмосферу.", punishment_ua: "Warn → Ban 1–3 дні", punishment_ru: "Warn → Ban 1–3 дня", tags: ["5.3", "nrp", "nonrp"] },
            { category: "cat5", code: "Пункт 5.4", title_ua: "Fail RP", title_ru: "Fail RP", desc_ua: "Заборонено ігнорувати RP-ситуацію, відмовлятися від логічної взаємодії з іншими гравцями або навмисно поводитися так, щоб зірвати відігравання.", desc_ru: "Запрещено игнорировать RP-ситуацию, отказываться от логического взаимодействия или срывать отыгровку.", punishment_ua: "Warn → Ban 1 день", punishment_ru: "Warn → Ban 1 день", tags: ["5.4", "failrp", "зрив"] },
            { category: "cat5", code: "Пункт 5.5", title_ua: "MetaGaming (MG)", title_ru: "MetaGaming (MG)", desc_ua: "Заборонено використовувати в ігровому процесі інформацію, отриману поза грою (Discord, трансляції, особисті повідомлення тощо).", desc_ru: "Запрещено использовать в игровом процессе информацию, полученную вне игры.", punishment_ua: "Ban 1 день → Ban 3 дні", punishment_ru: "Ban 1 день → Ban 3 дня", tags: ["5.5", "mg", "metagaming", "оос"] },
            { category: "cat5", code: "Пункт 5.6", title_ua: "CopBaiting", title_ru: "CopBaiting", desc_ua: "Заборонено навмисно провокувати працівників поліції на погоню, затримання або застосування сили без об’єктивної RP-причини.", desc_ru: "Запрещено намеренно провоцировать сотрудников полиции на погоню, задержание или применение силы без RP-причины.", punishment_ua: "Ban 1 день → Ban 3 дні", punishment_ru: "Ban 1 день → Ban 3 дня", tags: ["5.6", "copbaiting", "поліція", "погоня"] },
            { category: "cat5", code: "Пункт 5.7", title_ua: "Bug Abuse", title_ru: "Bug Abuse", desc_ua: "Заборонено навмисно використовувати помилки, недопрацювання та баги гри або сервера для отримання переваги, обходу обмежень або порушення ігрового процесу.", desc_ru: "Запрещено намеренно использовать ошибки и баги игры или сервера для получения преимущества.", punishment_ua: "Ban 1–7 днів; за серйозну експлуатацію — Permanent Ban", punishment_ru: "Ban 1–7 дней; за серьезную эксплуатацию — Permanent Ban", tags: ["5.7", "баги", "bug", "дюп"] },
            { category: "cat5", code: "Пункт 5.8", title_ua: "Тимінг (Teaming)", title_ru: "Тиминг (Teaming)", desc_ua: "Тимінг — узгоджене об’єднання гравців із протиборчих сторін для отримання нечесної переваги. Така змова заборонена.", desc_ru: "Тиминг — согласованное объединение игроков из противоборствующих сторон для получения нечестного преимущества.", punishment_ua: "За пунктами 1.5 та 14.2 залежно від тяжкості", punishment_ru: "По пунктам 1.5 и 14.2 в зависимости от тяжести", tags: ["5.8", "тимінг", "teaming", "змова"] },

            // SECTION 6: Вихід із гри та ухилення від покарань
            { category: "cat6", code: "Пункт 6.1", title_ua: "Combat Logging", title_ru: "Combat Logging", desc_ua: "Заборонено виходити із сервера, вимикати гру або навмисно втрачати з’єднання під час активної RP-ситуації, щоб уникнути її наслідків.", desc_ru: "Запрещено выходить из сервера или выключать игру во время активной RP-ситуации.", punishment_ua: "Ban 1 день → Ban 3 дні", punishment_ru: "Ban 1 день → Ban 3 дня", tags: ["6.1", "q", "вихід", "оф від арешту"] },
            { category: "cat6", code: "Пункт 6.2", title_ua: "Ухилення від RP", title_ru: "Уход от RP", desc_ua: "Заборонено навмисно залишати ситуацію, ховатися в недоступних місцях або використовувати ігрові механіки виключно для уникнення взаємодії з іншими гравцями.", desc_ru: "Запрещено намеренно покидать ситуацию, прятаться в недоступных местах для ухода от взаимодействия.", punishment_ua: "Warn → Ban 12 годин → Ban 1 день", punishment_ru: "Warn → Ban 12 часов → Ban 1 день", tags: ["6.2", "уход от рп", "ухилення"] },
            { category: "cat6", code: "Пункт 6.3", title_ua: "Обхід покарання", title_ru: "Обход наказания", desc_ua: "Заборонено обходити призначений бан за допомогою додаткових акаунтів, твінків, чужих акаунтів або інших способів.", desc_ru: "Запрещено обходить назначенный бан с помощью дополнительных аккаунтов или твинков.", punishment_ua: "Ban 7–14 днів або Permanent Ban", punishment_ru: "Ban 7–14 дней или Permanent Ban", tags: ["6.3", "обхід", "твінк", "мультиакк"] },

            // SECTION 7: Зовнішній вигляд та імена персонажів
            { category: "cat7", code: "Пункт 7.1", title_ua: "Провокаційні імена та образи", title_ru: "Провокационные имена и внешность", desc_ua: "Заборонено використовувати ніки, скіни, зображення й зовнішній вигляд персонажа, що містять образи, погрози, дискримінацію або навмисно провокаційні матеріали.", desc_ru: "Запрещено использовать ники и внешность персонажа, содержащие оскорбления, угрозы или дискриминацию.", punishment_ua: "Warn з вимогою змінити нік/вигляд → Ban 1–3 дні", punishment_ru: "Warn с требованием сменить ник/внешность → Ban 1–3 дня", tags: ["7.1", "нікмейк", "нік", "скіни"] },
            { category: "cat7", code: "Пункт 7.2", title_ua: "Імітація працівників служб", title_ru: "Имитация работников служб", desc_ua: "Заборонено використовувати форму, зовнішній вигляд і позначення державних або спеціальних служб, щоб видати себе за їхнього працівника та обманути інших гравців.", desc_ru: "Запрещено использовать форму и внешний вид спецслужб, чтобы выдать себя за их работника.", punishment_ua: "Ban 1–3 дні", punishment_ru: "Ban 1–3 дня", tags: ["7.2", "форма", "обман", "імітація"] },
            { category: "cat7", code: "Пункт 7.3", title_ua: "Скіни тварин", title_ru: "Скины животных", desc_ua: "Скіни тварин допускаються лише за умови відповідного RP-відігравання, якщо така можливість передбачена сервером.", desc_ru: "Скины животных допускаются только при условии соответствующей RP-отыгровки.", punishment_ua: "Warn → Ban 1–5 днів", punishment_ru: "Warn → Ban 1–5 дней", tags: ["7.3", "тварин", "животные", "пес"] },
            { category: "cat7", code: "Пункт 7.4", title_ua: "Робота в держфракції без членства", title_ru: "Работа в госфракции без членства", desc_ua: "Працювати від імені фракції дозволено лише після подання заявки, її схвалення та офіційного прийняття до складу.", desc_ru: "Работать от имени фракции разрешено только после официального принятия в состав.", punishment_ua: "Ban 1 день", punishment_ru: "Ban 1 день", tags: ["7.4", "фракція", "гос", "без заявки"] },

            // SECTION 8: Голосовий чат
            { category: "cat8", code: "Пункт 8.1", title_ua: "Сторонні звуки та музика", title_ru: "Сторонние звуки и музыка", desc_ua: "Заборонено вмикати гучні сторонні звуки, музику, записи та інші аудіоматеріали без згоди учасників ситуації.", desc_ru: "Запрещено включать громкие сторонние звуки и музыку без согласия участников ситуации.", punishment_ua: "Warn → Kick → Ban 12 годин", punishment_ru: "Warn → Kick → Ban 12 часов", tags: ["8.1", "музика", "саундпад", "шум"] },

        // GUARANTEED WORKING LANGUAGE SELECTION FUNCTION
        window.selectLang = function(lang) {
            hapticFeedback();
            window.currentLang = (lang === 'ru') ? 'ru' : 'ua';
            
            try {
                localStorage.setItem('lviv_rp_lang', window.currentLang);
            } catch (e) {
                console.warn("localStorage locked", e);
            }

            const modal = document.getElementById('lang-modal');
            if (modal) {
                modal.style.display = 'none';
            }

            window.renderAll();
        };

        // TOGGLE LANGUAGE VIA HEADER BUTTON
        window.toggleLang = function() {
            hapticFeedback();
            window.currentLang = (window.currentLang === 'ua') ? 'ru' : 'ua';
            
            try {
                localStorage.setItem('lviv_rp_lang', window.currentLang);
            } catch (e) {}

            window.renderAll();
        };

        // RENDER ALL INTERFACE ELEMENTS
        window.renderAll = function() {
            const lang = window.currentLang;
            const dict = i18n[lang];

            // Header & Search localization
            document.getElementById('current-lang-pill').innerText = lang.toUpperCase();
            document.getElementById('app-header-subtitle').innerText = dict.subtitle;
            document.getElementById('search-input').placeholder = dict.placeholder;
            document.getElementById('count-label').innerText = dict.countLabel;
            document.getElementById('no-res-title').innerText = dict.noResTitle;
            document.getElementById('no-res-desc').innerText = dict.noResDesc;
            document.getElementById('reset-search-btn').innerText = dict.resetSearch;

            window.renderCategories();
            window.renderContent();
        };

            const container = document.getElementById('category-pills');

            const categoriesKeys = [
                'all', 'cat1', 'cat2', 'cat3', 'cat4', 'cat5', 'cat6', 'cat7', 'cat8',
                'cat9', 'cat10', 'cat11', 'cat12', 'cat13', 'cat14', 'cat15', 'cat16',
                'cat17', 'cat18', 'cat19', 'cat20', 'cat21', 'cat22'
            ];

            container.innerHTML = categoriesKeys.map(key => {
                const isActive = window.activeCategory === key;
                const icon = categoryIcons[key] || "fa-folder";
                const label = dict.categories[key] || key;

                let count = 0;
                if (key === 'all') count = rulesData.length;
                else count = rulesData.filter(r => r.category === key).length;

                return `
                    <button 
                        type="button"
                        onclick="window.setCategory('${key}')"
                        class="p-3 rounded-xl flex flex-col justify-between text-left transition-all active:scale-95 ${isActive ? 'glass-card-active border-gold-500' : 'glass-card hover:border-gold-500/40'}"
                    >
                        <div class="flex items-center justify-between w-full mb-1">
                            <span class="w-7 h-7 rounded-lg ${isActive ? 'bg-gold-500 text-coffee-950' : 'bg-coffee-800 text-gold-400'} flex items-center justify-center text-xs">
                                <i class="fa-solid ${icon}"></i>
                            </span>
                            <span class="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded-full ${isActive ? 'bg-gold-500/20 text-gold-300' : 'bg-coffee-950/60 text-cream-400'}">
                                ${count}
                            </span>
                        </div>
                        <span class="text-xs font-bold ${isActive ? 'text-gold-300' : 'text-cream-200'} leading-snug">
                            ${label}
                        </span>
                    </button>
                `;
            }).join('');
        };

        // SWITCH CATEGORY
        window.setCategory = function(catKey) {
            hapticFeedback();
            window.activeCategory = catKey;
            window.renderCategories();
            window.renderContent();
        };

        // RENDER RULES LIST
        window.renderContent = function() {
            const lang = window.currentLang;
            const dict = i18n[lang];
            const rulesContainer = document.getElementById('rules-container');
            const noResults = document.getElementById('no-results');
            const sectionTitle = document.getElementById('section-title');
            const rulesCount = document.getElementById('rules-count');

            // Set Section Title
            const icon = categoryIcons[window.activeCategory] || "fa-book";
            const titleText = dict.titles[window.activeCategory] || dict.titles.all;
            sectionTitle.innerHTML = `<i class="fa-solid ${icon} text-gold-500"></i> <span>${titleText}</span>`;

            // FILTER RULES
            let filtered = rulesData;
            if (window.activeCategory !== 'all') {
                filtered = filtered.filter(r => r.category === window.activeCategory);
            }

            if (window.searchQuery.length > 0) {
                const q = window.searchQuery;
                filtered = filtered.filter(rule => {
                    const title = (lang === 'ua' ? rule.title_ua : rule.title_ru).toLowerCase();
                    const desc = (lang === 'ua' ? rule.desc_ua : rule.desc_ru).toLowerCase();
                    const code = rule.code.toLowerCase();
                    const tags = (rule.tags || []).join(' ').toLowerCase();
                    return title.includes(q) || desc.includes(q) || code.includes(q) || tags.includes(q);
                });
            }

            rulesCount.innerText = filtered.length;

            if (filtered.length === 0) {
                rulesContainer.classList.add('hidden');
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            rulesContainer.classList.remove('hidden');

            rulesContainer.innerHTML = filtered.map(rule => {
                const title = lang === 'ua' ? rule.title_ua : rule.title_ru;
                const desc = lang === 'ua' ? rule.desc_ua : rule.desc_ru;
                const punishment = lang === 'ua' ? rule.punishment_ua : rule.punishment_ru;

                return `
                    <div class="glass-card rounded-2xl p-4 space-y-3 transition-all border border-gold-600/20 hover:border-gold-500/40">
                        <!-- Rule Header -->
                        <div class="flex items-center justify-between gap-2 border-b border-gold-600/15 pb-2.5">
                            <div class="flex items-center gap-2">
                                <span class="bg-gradient-to-r from-gold-500 to-gold-600 text-coffee-950 font-black text-xs px-2.5 py-1 rounded-lg font-mono shadow-sm">
                                    ${rule.code}
                                </span>
                                <h3 class="font-serif font-bold text-sm sm:text-base text-cream-100">${title}</h3>
                            </div>
                            <button type="button" onclick="window.copyRule('${rule.code}')" class="text-xs text-gold-400 hover:text-gold-300 px-2.5 py-1 rounded-lg bg-coffee-900 border border-gold-600/30 flex items-center gap-1.5 active:scale-90 transition-transform shadow-sm shrink-0">
                                <i class="fa-regular fa-copy text-gold-500"></i>
                                <span class="text-[10px] uppercase font-bold tracking-wider">${dict.copyBtn}</span>
                            </button>
                        </div>

                        <!-- Rule Description -->
                        <p class="text-xs sm:text-sm text-cream-200 leading-relaxed font-normal">${desc}</p>

                        <!-- Punishment Block -->
                        <div class="pt-1">
                            <div class="bg-gradient-to-r from-red-950/40 via-coffee-900 to-coffee-950 p-2.5 rounded-xl border border-red-500/30 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 shadow-inner">
                                <div class="flex items-center gap-2">
                                    <span class="w-6 h-6 rounded-lg bg-red-900/60 border border-red-500/40 flex items-center justify-center shrink-0">
                                        <i class="fa-solid fa-gavel text-red-400 text-xs"></i>
                                    </span>
                                    <span class="text-[11px] font-bold uppercase tracking-wider text-red-400 font-mono">
                                        ${dict.punishmentLabel}
                                    </span>
                                </div>
                                <div class="text-xs font-semibold text-cream-100 pl-8 sm:pl-0">
                                    ${punishment}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        };

        // SEARCH HANDLERS
        window.handleSearch = function() {
            const input = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search');
            window.searchQuery = input.value.trim().toLowerCase();

            if (window.searchQuery.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            window.renderContent();
        };

        window.clearSearch = function() {
            hapticFeedback();
            const input = document.getElementById('search-input');
            input.value = '';
            window.searchQuery = '';
            document.getElementById('clear-search').classList.add('hidden');
            window.renderContent();
        };

        // COPY RULE TO CLIPBOARD
        window.copyRule = function(code) {
            hapticFeedback();
            const rule = rulesData.find(r => r.code === code);
            if (!rule) return;

            const lang = window.currentLang;
            const title = lang === 'ua' ? rule.title_ua : rule.title_ru;
            const desc = lang === 'ua' ? rule.desc_ua : rule.desc_ru;
            const punishment = lang === 'ua' ? rule.punishment_ua : rule.punishment_ru;

            const text = `[Львів RP] ${rule.code} - ${title}: ${desc} (${punishment})`;

            try {
                const dummy = document.createElement('textarea');
                document.body.appendChild(dummy);
                dummy.value = text;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
            } catch(e) {}

            window.showToast(i18n[lang].copySuccess);
        };

        // TOAST NOTIFICATION
        window.showToast = function(msg) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'bg-coffee-900 border border-gold-500 text-gold-400 px-4 py-2 rounded-xl text-xs font-bold shadow-2xl transition-all duration-300 opacity-0 translate-y-2';
            toast.innerText = msg;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-2');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        };

        // ON PAGE LOAD INIT
        document.addEventListener('DOMContentLoaded', function() {
            let savedLang = null;
            try {
                savedLang = localStorage.getItem('lviv_rp_lang');
            } catch(e) {}

            const modal = document.getElementById('lang-modal');

            if (savedLang === 'ua' || savedLang === 'ru') {
                window.currentLang = savedLang;
                if (modal) modal.style.display = 'none';
            } else {
                window.currentLang = 'ua';
                if (modal) modal.style.display = 'flex';
            }

            window.renderAll();
        });
    </script>
</body>
</html>
